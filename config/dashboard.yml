dashboard:
  # The ordered list of languages that will be displayed on the dashboard
  languages:
    - de
    - en
  theme: default
  goals:
    title:
      de: "Ziele"
      en: "Goals"
  status:
    title:
      de: "Status"
      en: "Status"
    indexes:
      traffic-density:
        name:
          de: Verkehrsdichte
          en: Traffic Density
        variable: traffic-density-index
      travel-times:
        name:
          de: Fahrzeiten
          en: Travel times
        variable: travel-times-index
      safety:
        name:
          de: Verkehrssicherheit
          en: Road traffic safety
        variable: road-safety-index
      pollution:
        name:
          de: Luftverschmutzung
          en: Pollution level
        variable: pollution-index
      noise:
        name:
          de: Lärmbelastung
          en: Noise level
        variable: noise-index
      green-spaces:
        name:
          de: Freifläche
          en: Green spaces
        variable: green-spaces-index
  powerUps:
    title:
      de: "Power-Ups"
      en: "Power-Ups"
    button:
      text:
        de: "<span class='large'>Power-Ups aktivieren</span>"
        en: "Activate Power-Ups"
    cancelButton:
      text:
        de: "Abbrechen"
        en: "Cancel"
    selector:
      # Number of seconds after which the Power-up selector times out
      timeout: 30
      # If true, the Power-up selector's randomizer will not consider the Power-ups that were used
      # last, unless there are no other Power-ups available.
      hideLastActive: true
    noneActive:
      text:
        de: 'Keine Power-Ups aktiv'
        en: 'No Power-Ups active'
    disableButton:
      text:
        de: 'Deaktivieren'
        en: 'Disable'
  actions:
    buttons:
      - id: show-pollution
        text:
          de: "<span class='large'>Luftverschmutzung</span><br>anzeigen"
          en: "Show pollution"
      - id: show-noise
        text:
          de: "<span class='large'>Lärmbelastung</span><br>anzeigen"
          en: "Show noise"
