<!DOCTYPE html>
<meta charset="utf-8">
<head>
  <link rel="stylesheet" href="vendor/roboto-condensed-v19-latin/robot-condensed-v19-latin.css">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <script src="vendor/jquery/jquery.slim.min.js"></script>
  <script src="vendor/popper.js/umd/popper.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="vendor/pixi.js/browser/pixi.min.js"></script>
  <script src="vendor/chart.js/chart.min.js"></script>
  <title>The Future of Mobility</title>
</head>
<body>
<div class="fms-desktop">
  <div class="container-fluid">
    <div class="row justify-content-center pt-4">
      <div class="col-xl-6 col-md-8 mb-4">
        <div data-component="app-container"></div>
      </div>
      <div class="col-xl-3 col-md-4 mb-4">
        <div class="status" data-component="status"></div>
        <div data-component="citizen-request-container"></div>
      </div>
      <div class="col-xl-3 col-md-4 offset-md-8 offset-xl-0">
        <div data-component="powerUpPanel"></div>

        <div class="accordion" id="accordion-data">
          <div class="card">
            <div class="card-header">
              <h2 class="mb-0">
                <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapseCounters" >
                  Counters
                </button>
              </h2>
            </div>
            <div id="collapseCounters" class="collapse" data-parent="#accordion-data">
              <div class="counters" data-component="counters"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h2 class="mb-0">
                <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapseInspector" >
                  Data Inspector
                </button>
              </h2>
            </div>
            <div id="collapseInspector" class="collapse" data-parent="#accordion-data">
              <div class="p-2" data-component="dataInspector"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">
              <h2 class="mb-0">
                <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapseGoalInspector" >
                  Goal Inspector
                </button>
              </h2>
            </div>
            <div id="collapseGoalInspector" class="collapse" data-parent="#accordion-data">
              <div data-component="goal-debug-container" class="p-2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
