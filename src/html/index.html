<!DOCTYPE html>
<meta charset="utf-8">
<head>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <script src="vendor/jquery/jquery.slim.min.js"></script>
  <script src="vendor/popper.js/umd/popper.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="vendor/pixi.js/pixi.min.js"></script>
  <script src="vendor/chart.js/chart.umd.min.js"></script>
  <title>The Future of Mobility</title>
</head>
<body>
<div class="fms-desktop">
  <div class="container-fluid">
    <div class="row justify-content-center pt-4">
      <div class="col-xl-6 col-md-8 mb-4">
        <div data-component="app-container"></div>
      </div>
      <div class="col-xl-3 col-md-4 mb-4">
        <div class="status" data-component="status"></div>
        <div data-component="citizen-request-container"></div>
      </div>
      <div class="col-xl-3 col-md-4 offset-md-8 offset-xl-0">
        <div data-component="powerUpPanel"></div>

        <div class="accordion" id="accordion-data">
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingCounters">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCounters" aria-expanded="false" aria-controls="collapseCounters">
                Counters
              </button>
            </h2>
            <div id="collapseCounters" class="accordion-collapse collapse" aria-labelledby="headingCounters" data-bs-parent="#accordion-data">
              <div class="accordion-body counters" data-component="counters"></div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingInspector">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInspector" aria-expanded="false" aria-controls="collapseInspector">
                Data Inspector
              </button>
            </h2>
            <div id="collapseInspector" class="accordion-collapse collapse" aria-labelledby="headingInspector" data-bs-parent="#accordion-data">
              <div class="accordion-body p-2" data-component="dataInspector"></div>
            </div>
          </div>
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingGoalInspector">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGoalInspector" aria-expanded="false" aria-controls="collapseGoalInspector">
                Goal Inspector
              </button>
            </h2>
            <div id="collapseGoalInspector" class="accordion-collapse collapse" aria-labelledby="headingGoalInspector" data-bs-parent="#accordion-data">
              <div data-component="goal-debug-container" class="accordion-body p-2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
